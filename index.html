<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13242b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiny World">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>Tiny World V7.1</title>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Tiny World simulation"></canvas>

  <div class="topbar">
    <div class="worldhud">
      <div class="hudstat"><span>👥</span><b id="pop">2</b></div>
      <div class="hudstat"><span>☀️</span><b id="day">1</b></div>
      <div class="hudera"><span>🏕</span><b id="era">Primitive</b></div>
    </div>
    <div class="topspacer"></div>
    <div class="hudcontrols">
      <button id="centerBtn" class="iconbtn" type="button" aria-label="Center settlement">⌾</button>
      <button id="inspectBtn" class="iconbtn active" type="button" aria-label="Inspect citizens">👁</button>
      <button id="pauseBtn" class="iconbtn" type="button" aria-label="Pause">⏸</button>
      <button id="speedBtn" class="speedbtn" type="button">×1</button>
    </div>
  </div>

  <button id="layerBtn" class="layerbtn surface" type="button" aria-label="Switch world layer">
    <span id="layerIcon">🌿</span><b id="layerLabel">Surface</b><small>⇅</small>
  </button>
  <button id="uiToggleBtn" class="uiToggleBtn" type="button" aria-label="Hide interface">◫</button>

  <section id="miniMapPanel" class="minimapPanel compact" aria-label="World atlas">
    <button id="miniMapToggle" class="minimapToggle" type="button" aria-label="Expand or collapse atlas">
      <span>🗺️</span><b>Atlas</b><small>⌄</small>
    </button>
    <div class="minimapContent">
      <div class="minimapHead"><b>World Atlas</b><small id="miniMapMode">Surface</small></div>
      <canvas id="miniMap" width="168" height="116"></canvas>
    </div>
  </section>

  <div id="status" class="srStatus">Inspect · drag map · pinch to zoom</div>

  <div id="toolChip" class="toolchip">
    <span id="toolIcon">👁</span>
    <div><b id="toolName">Inspect</b><small id="toolHint">Tap a person</small></div>
    <button id="brushBtn" type="button"><span>🖌</span><b id="brushLabel">12</b></button>
  </div>

  <nav id="mainNav" class="mainnav" aria-label="Game controls">
    <button class="navtab" data-main-tab="world" type="button"><span>🌍</span><b>World</b></button>
    <button class="navtab" data-main-tab="powers" type="button"><span>✨</span><b>God Powers</b></button>
    <button class="navtab" data-main-tab="resources" type="button"><span>🧰</span><b>Resources</b></button>
  </nav>

  <section id="gameMenu" class="gamesheet hidden">
    <div class="sheetHandle"></div>
    <div class="sheetHead">
      <div>
        <b id="menuTitle">World</b>
        <div id="menuSubtitle" class="muted">Manage Tiny World</div>
      </div>
      <button id="menuClose" class="close" type="button">✕</button>
    </div>
    <div id="menuSegments" class="segments hidden"></div>
    <div id="menuBody" class="menuBody"></div>
  </section>

  <section id="citizen" class="drawer left hidden">
    <div class="drawerhead">
      <div><b id="citizenName">Citizen</b><div id="citizenSub" class="muted"></div></div>
      <button class="close" data-close="citizen" type="button">✕</button>
    </div>
    <div id="citizenBody"></div>
  </section>

  <section id="brushPanel" class="floatpanel hidden">
    <button class="brush" data-size="5" type="button">Small</button>
    <button class="brush active" data-size="12" type="button">Medium</button>
    <button class="brush" data-size="24" type="button">Large</button>
    <button class="brush" data-size="40" type="button">Huge</button>
  </section>

  <!-- Hidden compatibility containers used by the simulation's history/civilization renderers. -->
  <section id="history" class="hidden legacy"><div id="historyList"></div></section>
  <section id="civilization" class="hidden legacy">
    <b id="settlementName"></b><div id="settlementEra"></div><div id="civBody"></div>
  </section>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <div id="splash">
    <div class="logo">
      <div class="island">🌍</div>
      <h1>Tiny World</h1>
      <p>V7.1 · Brushed World Pass</p>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
